get:
  tags: [Contacts]
  summary: Get list of contacts
  operationId: getContacts
  security: [{ bearerAuth: [] }]
  parameters:
    - in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    - in: query
      name: perPage
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    - in: query
      name: sortBy
      schema: { type: string, enum: [name, email, phoneNumber, createdAt] }
    - in: query
      name: sortOrder
      schema: { type: string, enum: [asc, desc], default: asc }
    - in: query
      name: isFavourite
      schema: { type: boolean }
    - in: query
      name: contactType
      schema: { type: string, enum: [home, work, other] }
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../../../docs/openapi.yaml#/components/schemas/Contact

post:
  tags: [Contacts]
  summary: Create a contact
  operationId: createContact
  description: Accepts JSON or multipart/form-data for photo upload.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../../docs/openapi.yaml#/components/schemas/ContactCreate
      multipart/form-data:
        schema:
          allOf:
            - $ref: ../../../docs/openapi.yaml#/components/schemas/ContactCreate
          properties:
            photo:
              type: string
              format: binary
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../../docs/openapi.yaml#/components/schemas/Contact
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../../../docs/openapi.yaml#/components/schemas/Error
