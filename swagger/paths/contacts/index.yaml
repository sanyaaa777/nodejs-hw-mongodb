get:
  tags: [Contacts]
  summary: Get list of contacts
  operationId: getContacts
  description: Returns contacts with pagination meta (module 4 style).
  security: [{ bearerAuth: [] }]
  parameters:
    - in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    - in: query
      name: perPage
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    - in: query
      name: sortBy
      schema: { type: string, enum: [name, email, phoneNumber, createdAt] }
    - in: query
      name: sortOrder
      schema: { type: string, enum: [asc, desc], default: asc }
    - in: query
      name: isFavourite
      schema: { type: boolean }
    - in: query
      name: contactType
      schema: { type: string, enum: [home, work, other] }
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../../docs/openapi.yaml#/components/schemas/ApiContactsListResponse
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse

post:
  tags: [Contacts]
  summary: Create a contact
  operationId: createContact
  description: Accepts multipart/form-data with optional photo upload.
  security: [{ bearerAuth: [] }]
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          required: [name, phoneNumber, contactType]
          properties:
            name: { type: string, minLength: 3, maxLength: 20 }
            phoneNumber: { type: string, minLength: 3, maxLength: 20 }
            email: { type: [string, 'null'], format: email }
            contactType: { type: string, enum: [home, work, other] }
            isFavourite: { type: boolean, default: false }
            photo: { type: string, format: binary }
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../../docs/openapi.yaml#/components/schemas/ApiContactResponse
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse
