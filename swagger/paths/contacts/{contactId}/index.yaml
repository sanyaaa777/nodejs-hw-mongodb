get:
  tags: [Contacts]
  summary: Get contact by ID
  operationId: getContactById
  description: Returns a single contact wrapped in { status, message, data }.
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: contactId
      required: true
      schema: { type: string }
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiContactResponse
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse

patch:
  tags: [Contacts]
  summary: Update contact
  operationId: patchContact
  description: Accepts only multipart/form-data; updates only explicitly sent fields.
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: contactId
      required: true
      schema: { type: string }
  requestBody:
    required: false
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name: { type: string }
            phoneNumber: { type: string }
            email: { type: [string, 'null'], format: email }
            contactType: { type: string, enum: [home, work, other] }
            isFavourite: { type: boolean }
            photo: { type: string, format: binary }
  responses:
    '200':
      description: Updated
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiContactResponse
    '400':
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse

delete:
  tags: [Contacts]
  summary: Delete contact
  operationId: deleteContact
  security: [{ bearerAuth: [] }]
  parameters:
    - in: path
      name: contactId
      required: true
      schema: { type: string }
  responses:
    '204':
      description: No Content
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse
    '404':
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../../../../docs/openapi.yaml#/components/schemas/ApiErrorResponse
